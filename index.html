<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartoonify Image</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:1000px;margin:2rem auto;padding:0 1rem;color:#222}
 h1{margin-bottom:.2rem} .sub{color:#666;margin-top:0}
 form{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:1.2rem 0}
 input,select,button,a.btn{padding:.6rem;font-size:1rem;border:1px solid #ccc;border-radius:6px}
 input[type=number]{width:70px}
 button,a.btn{background:#7c3aed;color:#fff;border:0;cursor:pointer;text-decoration:none}
 .err{background:#fee2e2;color:#991b1b;padding:.8rem;border-radius:6px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
 .grid img{width:100%;border-radius:8px;border:1px solid #ddd}
 @media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Cartoonify Image</h1>
<p class="sub">Photo upload karo, cartoon version paao.</p>

<form method="post" enctype="multipart/form-data">
  <input type="file" name="image" accept="image/*" required>
  <select name="style">
    <option value="classic" {{ 'selected' if style == 'classic' }}>Classic</option>
    <option value="painted" {{ 'selected' if style == 'painted' }}>Painted (K-Means)</option>
  </select>
  <label>Colors <input type="number" name="colors" value="8" min="2" max="20"></label>
  <button type="submit">Cartoonify</button>
</form>

{% if error %}<div class="err">{{ error }}</div>{% endif %}

{% if cartoon %}
<div class="grid">
  <div><h3>Original</h3><img src="{{ original }}" alt="original"></div>
  <div><h3>Cartoon</h3><img src="{{ cartoon }}" alt="cartoon"></div>
</div>
<p><a class="btn" href="{{ cartoon }}" download="cartoon.png">Download Cartoon</a></p>
{% endif %}
</body>
</html>
